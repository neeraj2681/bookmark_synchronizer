<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bookmark Synchronizer - Saved Bookmarks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2.5em;
      font-weight: 300;
    }
    
    .search-box {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #ddd;
      border-radius: 50px;
      font-size: 16px;
      margin-bottom: 30px;
      background: white;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .search-box:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      color: #666;
      font-size: 18px;
    }
    
    .error {
      text-align: center;
      padding: 50px;
      color: #f44336;
      font-size: 18px;
    }
    
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .bookmark-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      border: 1px solid #eee;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .bookmark-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    
    .bookmark-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .bookmark-url {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .bookmark-date {
      color: #999;
      font-size: 12px;
      margin-bottom: 10px;
    }
    
    .bookmark-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    
    .tag {
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    
    .stats {
      text-align: center;
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
    }
    
    .refresh-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #667eea;
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }
    
    .refresh-btn:hover {
      background: #5a67d8;
      transform: scale(1.1);
    }
    
    .no-bookmarks {
      text-align: center;
      padding: 100px 20px;
      color: #666;
    }
    
    .no-bookmarks h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #999;
    }
    
    .no-bookmarks p {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Saved Bookmarks</h1>
    
    <input type="text" class="search-box" id="search-box" placeholder="🔍 Search bookmarks...">
    
    <div class="stats" id="stats"></div>
    
    <div id="loading" class="loading">
      Loading your bookmarks...
    </div>
    
    <div id="error" class="error" style="display: none;"></div>
    
    <div id="bookmarks-container" class="bookmarks-grid" style="display: none;"></div>
    
    <div id="no-bookmarks" class="no-bookmarks" style="display: none;">
      <h2>No bookmarks found</h2>
      <p>Start saving bookmarks by clicking on the extension icon while browsing!</p>
    </div>
  </div>
  
  <button class="refresh-btn" id="refresh-btn" title="Refresh">🔄</button>
  
  <script src="bookmarks.js"></script>
</body>
</html>
